version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: quoteflow_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: quoteflow
    ports:
      - "5433:5432"
    volumes:
      - quoteflow_pgdata:/var/lib/postgresql/data

volumes:
  quoteflow_pgdata: